name: GIA regression checks

on:
  push:
    branches: [main]
    paths:
      - 'assets/phase2*'
      - 'assets/manual-reader.js'
      - 'assets/guide-tools.js'
      - 'tests/phase2-smoke.js'
      - 'assets/gia-next.js'
      - 'assets/gia-next.css'
      - 'assets/app.js'
      - 'data/guide-content.json'
      - 'index.html'
      - 'service-worker.js'
      - 'tests/gia-smoke.js'
      - '.github/workflows/gia-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: GIA conversation and referral regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GIA
        run: node tests/gia-smoke.js

      - name: Test Phase II integration
        run: node tests/phase2-smoke.js
