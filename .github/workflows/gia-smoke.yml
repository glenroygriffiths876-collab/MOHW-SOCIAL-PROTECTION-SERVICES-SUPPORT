name: GIA regression checks

on:
  push:
    branches: [main]
    paths:
      - 'assets/phase2*'
      - 'assets/premium-2026.css'
      - 'assets/premium-experience.js'
      - 'assets/exact-home.css'
      - 'assets/exact-home.js'
      - 'assets/mobile-image-v3.js'
      - 'assets/mobile-image-v3.css'
      - 'assets/mobile-v3/**'
      - 'tests/mobile-v3-smoke.js'
      - 'assets/manual-reader.js'
      - 'assets/guide-tools.js'
      - 'tests/phase2-smoke.js'
      - 'assets/gia-next.js'
      - 'assets/gia-next.css'
      - 'assets/app.js'
      - 'data/guide-content.json'
      - 'index.html'
      - 'service-worker.js'
      - 'tests/gia-smoke.js'
      - 'tests/exact-home-smoke.js'
      - 'tests/referrals-premium-smoke.js'
      - 'assets/referrals-overlay.css'
      - 'assets/referrals-overlay.js'
      - 'assets/decision-image-overlay.js'
      - 'assets/decision-image-overlay.css'
      - 'assets/decision-overlay-desktop.webp'
      - 'assets/decision-overlay-mobile.webp'
      - 'tests/decision-overlay-smoke.js'
      - 'assets/referrals-overlay-desktop.webp'
      - 'assets/referrals-overlay-mobile.webp'
      - 'assets/referral-photo-*.webp'
      - 'assets/referrals-premium-v2.css'
      - '.github/workflows/gia-smoke.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: GIA conversation and referral regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test GIA
        run: node tests/gia-smoke.js

      - name: Test Phase II integration
        run: node tests/phase2-smoke.js
      - name: Test premium accessibility settings
        run: node tests/accessibility-premium-smoke.js
      - name: Test exact artwork homepage
        run: node tests/exact-home-smoke.js
      - name: Test premium mobile screenshot and real controls
        run: node tests/mobile-v3-smoke.js
      - name: Verify official MOHW referral rebuild, source content and all six graphics
        run: node tests/referrals-premium-smoke.js
      - name: Check 13 authentic decision situations and exact premium artwork
        run: node tests/decision-overlay-smoke.js
