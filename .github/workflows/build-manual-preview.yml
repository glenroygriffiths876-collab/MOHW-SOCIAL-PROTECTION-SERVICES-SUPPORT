name: Build source-preserving premium manual preview

on:
  push:
    branches:
      - design/gia-video-manual-preservation-2026-11-19
    paths:
      - scripts/build-premium-manual.py
      - .github/workflows/build-manual-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    if: github.ref == 'refs/heads/design/gia-video-manual-preservation-2026-11-19'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/gia-video-manual-preservation-2026-11-19
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.4
      - name: Generate one new cover plus all 43 source pages
        run: python scripts/build-premium-manual.py
      - name: Save review PDF only on this branch
        run: |
          git config user.name "mohw-manual-preview[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manual/premium-preview.pdf
          if git diff --cached --quiet; then
            echo "No content change."
          else
            git commit -m "Add source-preserving 43-page premium manual review PDF"
            git push origin HEAD:design/gia-video-manual-preservation-2026-11-19
          fi
