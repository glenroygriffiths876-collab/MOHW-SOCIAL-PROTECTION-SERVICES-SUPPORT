name: Premium Jamaica map preview QA
on:
  push:
    branches:
      - 'preview/premium-3d-jamaica-map-20261121'
    paths:
      - 'assets/preview-rebuild.*'
      - 'assets/preview-config.js'
      - 'index.html'
      - 'tests/preview-rebuild-browser.cjs'
      - '.github/workflows/premium-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core
      - name: Detect Chromium
        shell: bash
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            npx --yes playwright install chromium
            echo "CHROME_BIN=$HOME/.cache/ms-playwright/$(ls "$HOME/.cache/ms-playwright" | grep 'chromium-' | head -1)/chrome-linux/chrome" >> "$GITHUB_ENV"
          else
            echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          fi
      - name: Start static site for browser testing
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mohw-preview.log 2>&1 &
          for i in $(seq 1 35); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
      - name: Test mobile, tablet, desktop, map, services, video, manual, GIA sharing
        run: node tests/preview-rebuild-browser.cjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-jamaica-preview-screenshots
          path: /tmp/mohw-preview-shots/
          if-no-files-found: warn
