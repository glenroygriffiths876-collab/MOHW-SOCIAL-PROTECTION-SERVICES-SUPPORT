name: Premium navigation browser layout
on:
  push:
    branches: [main]
    paths:
      - 'assets/premium-ui-fix.css'
      - 'assets/accessibility-premium.css'
      - 'assets/accessibility-premium.js'
      - 'tests/accessibility-browser.cjs'
      - 'assets/exact-home.css'
      - 'assets/exact-home.js'
      - 'assets/mobile-image-v3.js'
      - 'assets/mobile-image-v3.css'
      - 'assets/home-dock-rebalance.css'
      - 'assets/referrals-overlay.css'
      - 'assets/referrals-overlay.js'
      - 'assets/decision-image-overlay.js'
      - 'assets/decision-image-overlay.css'
      - 'assets/decision-premium-compact.css'
      - 'assets/accessibility-premium.css'
      - 'assets/accessibility-premium.js'
      - 'tests/accessibility-premium-browser.cjs'
      - 'assets/decision-overlay-desktop.webp'
      - 'assets/decision-overlay-mobile.webp'
      - 'tests/decision-overlay-browser.cjs'
      - 'assets/referrals-overlay-desktop.webp'
      - 'assets/referrals-overlay-mobile.webp'
      - 'assets/referral-photo-*.webp'
      - 'assets/referrals-premium-v2.css'
      - 'assets/app.js'
      - 'tests/referrals-premium-browser.cjs'
      - 'assets/mobile-v3/**'
      - 'assets/guide-tools.js'
      - 'index.html'
      - 'tests/layout-browser.cjs'
      - '.github/workflows/premium-layout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/premium-ui-fix.css'
      - 'assets/accessibility-premium.css'
      - 'assets/accessibility-premium.js'
      - 'tests/accessibility-browser.cjs'
      - 'assets/exact-home.css'
      - 'assets/exact-home.js'
      - 'assets/mobile-image-v3.js'
      - 'assets/mobile-image-v3.css'
      - 'assets/home-dock-rebalance.css'
      - 'assets/referrals-premium-v2.css'
      - 'assets/app.js'
      - 'tests/referrals-premium-browser.cjs'
      - 'assets/mobile-v3/**'
      - 'assets/guide-tools.js'
      - 'index.html'
      - 'tests/layout-browser.cjs'
      - '.github/workflows/premium-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core
      - name: Detect installed Chrome
        shell: bash
        run: |
          set -eu
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            npx --yes playwright install chromium
          else
            echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          fi
      - name: Start static preview
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mohw-preview.log 2>&1 &
          for i in $(seq 1 35); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
      - name: Check actual desktop, tablet, phone, rotation and functionality
        run: node tests/layout-browser.cjs
      - name: Verify premium accessible settings on mobile, tablet and desktop
        run: node tests/accessibility-browser.cjs
      - name: Verify all 6 referral scenes on phones, tablets and desktops
        run: node tests/referrals-premium-browser.cjs
      - name: Verify all 13 decision situations, native service actions and image layovers
        run: node tests/decision-overlay-browser.cjs
      - name: Verify premium accessibility controls on phone, tablet and desktop
        run: node tests/accessibility-premium-browser.cjs
      - name: Publish viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mohw-responsive-screenshots
          path: /tmp/mohw-responsive-shots/
          if-no-files-found: warn
